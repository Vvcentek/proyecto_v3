server:
  port: ${PORT:8088}
spring:
  application:
    name: ferreteria-api
  datasource:
    url: jdbc:h2:file:./data/ferreteria
    username: sa
    password: ${DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  h2:
    console:
      enabled: false
  jackson:
    deserialization:
      fail-on-unknown-properties: true
      accept-float-as-int: false
      fail-on-numbers-for-enums: true
app:
  jwt:
    secret: ${JWT_SECRET:}
    issuer: ferreteria-los-maestros
    duration-minutes: 60
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5178,http://127.0.0.1:5178}
springdoc:
  swagger-ui:
    path: /swagger-ui.html
